name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── macOS ──────────────────────────────────────────────────────────
  build-macos:
    strategy:
      matrix:
        include:
          - name: x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build DMG
        run: |
          export VERSION="${GITHUB_REF#refs/tags/v}"
          export TARGET="${{ matrix.target }}"
          ./scripts/build-dmg.sh
          DMG_FILE=$(ls target/release/Portal-*.dmg | head -1)
          cp "$DMG_FILE" "Portal-macos-${{ matrix.name }}.dmg"
          PKG_FILE=$(ls target/release/Portal-*.pkg | head -1)
          cp "$PKG_FILE" "Portal-macos-${{ matrix.name }}.pkg"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}-dmg
          path: Portal-macos-${{ matrix.name }}.dmg

      - name: Upload pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}-pkg
          path: Portal-macos-${{ matrix.name }}.pkg

  # ── Linux ──────────────────────────────────────────────────────────
  build-linux:
    strategy:
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev

      - name: Build release
        run: cargo build --release

      - name: Package .tar.gz
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir Portal-linux-${{ matrix.name }}-v$VERSION
          cp target/release/portal Portal-linux-${{ matrix.name }}-v$VERSION/
          cp ROADMAP.md Portal-linux-${{ matrix.name }}-v$VERSION/README.md 2>/dev/null || true
          tar czf Portal-linux-${{ matrix.name }}-v$VERSION.tar.gz Portal-linux-${{ matrix.name }}-v$VERSION/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: |
            Portal-linux-${{ matrix.name }}-v*.tar.gz

  # ── Windows ────────────────────────────────────────────────────────
  build-windows:
    strategy:
      # An arm64 toolchain hiccup must not sink the x86_64 artifacts.
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target: x86_64-pc-windows-msvc
          - name: aarch64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install NSIS
        # Unconditional: makensis's presence on the windows-2025 image is
        # uncertain (actions/runner-images#11754); choco is idempotent.
        run: choco install nsis -y --no-progress

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package zip + installer
        shell: pwsh
        run: |
          $env:VERSION = "${GITHUB_REF#refs/tags/v}"
          ./scripts/build-windows.ps1 -Target "${{ matrix.target }}" -Arch "${{ matrix.name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}
          path: |
            Portal-windows-${{ matrix.name }}-v*.zip
            Portal-windows-${{ matrix.name }}-v*-setup.exe

  # ── GitHub Release ─────────────────────────────────────────────────
  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-dmg
          path: ./artifacts

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-dmg
          path: ./artifacts

      - name: Download macOS x86_64 pkg
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-pkg
          path: ./artifacts

      - name: Download macOS arm64 pkg
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-pkg
          path: ./artifacts

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: ./artifacts

      - name: Download Windows x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: ./artifacts

      - name: Download Windows aarch64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-aarch64
          path: ./artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*
