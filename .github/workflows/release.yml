name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── macOS ──────────────────────────────────────────────────────────
  build-macos:
    strategy:
      matrix:
        include:
          - name: x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build DMG
        run: |
          export VERSION="${GITHUB_REF#refs/tags/v}"
          export TARGET="${{ matrix.target }}"
          ./scripts/build-dmg.sh
          DMG_FILE=$(ls target/release/Portal-*.dmg | head -1)
          cp "$DMG_FILE" "Portal-macos-${{ matrix.name }}.dmg"
          PKG_FILE=$(ls target/release/Portal-*.pkg | head -1)
          cp "$PKG_FILE" "Portal-macos-${{ matrix.name }}.pkg"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}-dmg
          path: Portal-macos-${{ matrix.name }}.dmg

      - name: Upload pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}-pkg
          path: Portal-macos-${{ matrix.name }}.pkg

  # ── Linux ──────────────────────────────────────────────────────────
  build-linux:
    strategy:
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libpam0g-dev: local_auth/linux.rs links PAM for owner verification
          sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libpam0g-dev

      - name: Build release
        run: cargo build --release

      - name: Package .tar.gz
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir Portal-linux-${{ matrix.name }}-v$VERSION
          cp target/release/portal Portal-linux-${{ matrix.name }}-v$VERSION/
          cp ROADMAP.md Portal-linux-${{ matrix.name }}-v$VERSION/README.md 2>/dev/null || true
          tar czf Portal-linux-${{ matrix.name }}-v$VERSION.tar.gz Portal-linux-${{ matrix.name }}-v$VERSION/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: |
            Portal-linux-${{ matrix.name }}-v*.tar.gz

  # ── Windows ────────────────────────────────────────────────────────
  build-windows:
    strategy:
      # An arm64 toolchain hiccup must not sink the x86_64 artifacts.
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target: x86_64-pc-windows-msvc
          - name: aarch64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install NSIS
        # chocolatey.org's feed timed out on BOTH v0.19.5 attempts (a 504,
        # then a 100 s GET timeout) — the official NSIS zip is fetched
        # directly from SourceForge instead, with chocolatey as the last
        # resort. The extract dir is discovered from makensis.exe's location
        # (the zip's top-level folder name changes between releases) and
        # published into the job's PATH: later steps never re-read the
        # MACHINE path choco would have amended.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'nsis-extract'
          $downloaded = $false
          foreach ($url in @(
            'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip',
            'https://prdownloads.sourceforge.net/nsis/nsis-3.10.zip'
          )) {
            curl.exe --retry 5 --retry-all-errors --location --silent --show-error --fail $url -o $zip
            if ($LASTEXITCODE -eq 0) { $downloaded = $true; break }
            Write-Host "::warning::NSIS download failed: $url"
          }
          if ($downloaded) {
            Expand-Archive $zip -DestinationPath $extract -Force
            $nsisDir = (Get-ChildItem $extract -Recurse -Filter makensis.exe |
              Select-Object -First 1).DirectoryName
          } else {
            choco install nsis -y --no-progress --fail-on-unfound
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          }
          if (-not $nsisDir -or -not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            throw "makensis.exe not found after NSIS install"
          }
          Add-Content $env:GITHUB_PATH $nsisDir

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package zip + installer
        shell: pwsh
        run: |
          $env:VERSION = "${GITHUB_REF#refs/tags/v}"
          ./scripts/build-windows.ps1 -Target "${{ matrix.target }}" -Arch "${{ matrix.name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}
          path: |
            Portal-windows-${{ matrix.name }}-v*.zip
            Portal-windows-${{ matrix.name }}-v*-setup.exe

  # ── GitHub Release ─────────────────────────────────────────────────
  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-dmg
          path: ./artifacts

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-dmg
          path: ./artifacts

      - name: Download macOS x86_64 pkg
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-pkg
          path: ./artifacts

      - name: Download macOS arm64 pkg
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-pkg
          path: ./artifacts

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: ./artifacts

      - name: Download Windows x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: ./artifacts

      - name: Download Windows aarch64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-aarch64
          path: ./artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*
