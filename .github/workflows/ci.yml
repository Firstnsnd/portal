name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows is the one platform we cannot type-check locally: `cargo check
  # --target x86_64-pc-windows-msvc` from macOS dies inside ring's build
  # script (it compiles C with clang-cl for the MSVC ABI). This job is the
  # compile-feedback loop for every Windows-gated change.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      # The x86_64 leg LINKS, not just checks: .cargo/config.toml builds
      # this target with a static CRT (crt-static) so the shipped exe has
      # no VC++ Redistributable prerequisite — and only a real link
      # exercises that flag. Deps resolve once; the second target below is
      # incremental.
      - name: cargo build (x86_64-pc-windows-msvc)
        run: cargo build --target x86_64-pc-windows-msvc

      - name: cargo check (aarch64-pc-windows-msvc)
        run: cargo check --target aarch64-pc-windows-msvc

  # Linux is the other platform invisible from a macOS host: the keyring
  # Secret Service backend (and any future Linux-gated code) only compiles
  # here. Same feedback loop as windows-check.
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev

      - name: cargo check (all targets)
        run: cargo check --all-targets
